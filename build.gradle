// Build setup for the Thaumcraft API against Forge 26.2.
// Based on the Forge 26.2 MDK: https://github.com/MinecraftForge/MinecraftForge/tree/26.2/mdk

plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = '6.0.2'
group = 'thaumcraft'

// Mojang ships Java 25 to end users in 26.1+.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// The API sources live at the repository root (package thaumcraft.api),
// with each subfolder being a subpackage, rather than under src/main/java.
sourceSets.main {
    java {
        srcDirs = ['.']
        include '**/*.java'
        exclude 'build/**', '.gradle/**', 'gradle/**'
    }
    resources.srcDirs = []
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:26.2-65.1.6')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
